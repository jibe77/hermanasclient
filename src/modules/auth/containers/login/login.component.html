<sb-layout-auth>
    <div class="container">
        <amplify-authenticator>
            <ng-template amplifySlot="authenticated" let-user="user" let-signOut="signOut">
                <div>
                    <h2>Welcome {{ user.username }}!</h2>
                    <button (click)="signOut()" class="btn btn-primary">Sign Out</button>
                </div>
            </ng-template>
        </amplify-authenticator>
    </div>
</sb-layout-auth>
